name: Release

on:
  release:
    types: [published]

# Grant the workflow permission to write repository contents so the
# GITHUB_TOKEN can upload release assets. Without this the token may be
# read-only and produce "Resource not accessible by integration" errors.
permissions:
  contents: write


jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin (zip)
        run: npm run plugin-zip

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/common-wp-blocks.zip
          asset_name: common-wp-blocks.zip
          asset_content_type: application/zip
